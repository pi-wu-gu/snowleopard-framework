plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

// snowleopard-core 是零依赖纯 Java jar，用本地 maven 布局发布（目录式 flatDir 缺元数据，
// jarJar 会拒绝）。默认取 rootDir/libs/m2，可被 -PsnowleopardRepo= 或 SNOWLEOPARD_M2 覆盖。
def snowleopardRepo = providers.gradleProperty('snowleopardRepo')
        .orElse(providers.environmentVariable('SNOWLEOPARD_M2'))
        .orElse("${rootDir}/libs/m2")
        .get()

repositories {
    clear()   // 移除 MDG 注入的官方源，换国内可达镜像（已验证组合）
    maven { name = 'SnowLeopard Local';      url = uri(snowleopardRepo) }
    maven { name = 'NeoForged Mirror';      url = 'https://neoforged.forgecdn.net/releases/' }
    maven { name = 'NeoForged Meta Mirror'; url = 'https://neoforged.forgecdn.net/mojang-meta/' }
    maven { name = 'Mojang Libraries';      url = 'https://libraries.minecraft.net/' }
    mavenCentral()
}

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // jarJar = 把核心打进 mod jar 的 META-INF/jarjar（双件套的分发形态）：玩家只放一个模组 jar。
    // 版本用精确值：区间要拉版本清单、离线即失败；兼容性由 coreApi 校验兜底。
    jarJar(implementation("snowleopard.core:snowleopard-core:${snowleopard_core_version}"))
    // entitytools：实体控制工具组（MC 能力面）。同 jarJar 域装载——entitytools 的类
    // 与核心的类在同一嵌套域互相可见；壳里只写装配（显式 load，不走 ServiceLoader）。
    jarJar(implementation(project(':entitytools')))
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_github             : mod_github,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // 与核心一致：不依赖构建机 JDK 版本
    options.release = 21
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

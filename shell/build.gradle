plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

// snowleopard-core 是零依赖纯 Java jar，用本地 maven 布局发布（目录式 flatDir 缺元数据，
// jarJar 会拒绝）。默认取 rootDir/libs/m2，可被 -PsnowleopardRepo= 或 SNOWLEOPARD_M2 覆盖。
def snowleopardRepo = providers.gradleProperty('snowleopardRepo')
        .orElse(providers.environmentVariable('SNOWLEOPARD_M2'))
        .orElse("${rootDir}/libs/m2")
        .get()

repositories {
    clear()   // 移除 MDG 注入的官方源，换国内可达镜像（已验证组合）
    maven { name = 'SnowLeopard Local';      url = uri(snowleopardRepo) }
    maven { name = 'NeoForged Mirror';      url = 'https://neoforged.forgecdn.net/releases/' }
    maven { name = 'NeoForged Meta Mirror'; url = 'https://neoforged.forgecdn.net/mojang-meta/' }
    maven { name = 'Mojang Libraries';      url = 'https://libraries.minecraft.net/' }
    mavenCentral()
}

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            gameDirectory = project.file('run-server')   // 真机自测通道（M1 起）
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
            // dev 运行时额外类路径：纯 Java 的核心放库层即可（无 MC 引用）；
            // 用 MC 类的 entitytools 走 mods{} 源集进模组域（见上）。
            // （2026-10-23 排障：jarJar 模块不进 dev 类路径 → NoClassDefFoundError。）
            def extra = additionalRuntimeClasspathConfiguration
            extra.dependencies.add(project.dependencies.create(
                    "snowleopard.core:snowleopard-core:${snowleopard_core_version}"))
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            // entitytools 进模组域（M1 排障 2026-10-23：MC 能力面必须住模组域——
            // 库层（additionalRuntimeClasspath→BOOTSTRAP）看不见 net.minecraft 类）。
            sourceSet(project(':entitytools').sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // 实现与嵌入分开声明（2026-10-23 教训：jarJar(implementation(x)) 的模块会被排除出
    // dev 运行时的 legacyClassPath——NoClassDefFoundError: SnowLeopard$Options）。
    // implementation 管编译+dev 运行；jarJar 管打包嵌入（生产单 jar 分发不变）。
    implementation "snowleopard.core:snowleopard-core:${snowleopard_core_version}"
    implementation project(':entitytools')
    jarJar "snowleopard.core:snowleopard-core:${snowleopard_core_version}"
    jarJar project(':entitytools')
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_github             : mod_github,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // 与核心一致：不依赖构建机 JDK 版本
    options.release = 21
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

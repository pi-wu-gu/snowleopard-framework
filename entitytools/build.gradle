// entitytools：实体控制工具组（MC 能力面）。
// M0：纯契约（状态机/命名/口径）；M1 起含 MC 适配层（经 ModDevGradle 编译 MC 类）。
// 依赖雪豹决策核心（ToolGroupProvider / Result 契约类型）；运行时核心由 shell jarJar 提供。
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = mod_group_id
version = mod_version

def snowleopardRepo = providers.gradleProperty('snowleopardRepo')
        .orElse(providers.environmentVariable('SNOWLEOPARD_M2'))
        .orElse("${rootDir}/libs/m2")
        .get()

repositories {
    clear()
    maven { name = 'SnowLeopard Local';      url = uri(snowleopardRepo) }
    maven { name = 'NeoForged Mirror';      url = 'https://neoforged.forgecdn.net/releases/' }
    maven { name = 'NeoForged Meta Mirror'; url = 'https://neoforged.forgecdn.net/mojang-meta/' }
    maven { name = 'Mojang Libraries';      url = 'https://libraries.minecraft.net/' }
    mavenCentral()
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
}

dependencies {
    compileOnly "snowleopard.core:snowleopard-core:${snowleopard_core_version}"   // 运行时由 shell jarJar 提供
    testImplementation "snowleopard.core:snowleopard-core:${snowleopard_core_version}"
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
    // DocsCheckTest 读的是仓库里的 docs/ 与 gradle.properties，但它们**不是编译产物**，
    // 不声明成输入的话，改文档不会触发重跑 → 检查永远是上一次的绿（2026-10-28 实测：
    // 文档里留了不存在于源码树的类名，连着两个版本构建都"通过"）。
    inputs.dir rootProject.file('docs')
    inputs.file rootProject.file('gradle.properties')
}

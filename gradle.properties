org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# ---- 原始文件来源：minecraft mod/testmod-template-1.21.1（用户指定 2026-10-23）----
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.259
loader_version_range=[1,)
# 声明的 NeoForge **依赖下限**（写进 mods.toml，不参与编译）：
# 编译用 neo_version=21.1.259，但 21.1.x 是小版本补丁线、API 稳定，按整线接受 21.1 起。
# 卡在 21.1.259 会让低一点的整合包（如夯空学AI测试区 = 21.1.236）在加载阶段直接判
# "Missing mandatory dependency"，连进游戏的机会都没有——兼容性测试要跑就得先放行。
neo_dependency_range=[21.1,)

## Mod Properties
mod_id=snowleopard
mod_name=\u96ea\u8c79\u6846\u67b6 (Snow Leopard Framework)
mod_license=MIT
mod_version=1.16.5
mod_group_id=io.github.piwugu.snowleopard
mod_authors=pi-wu-gu
mod_github=pi-wu-gu/snowleopard-framework

# 依赖的雪豹决策核心版本：由核心仓 build.sh publish 产出到 libs/m2（jarJar 内嵌）
snowleopard_core_version=0.7.2
